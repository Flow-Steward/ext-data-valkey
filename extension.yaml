{
  "manifest_version": 2,
  "extension_id": "flowsteward.valkey",
  "kind": "tool_provider",
  "version": "1.1.0",
  "release_stage": "active",
  "display_name": "Valkey",
  "description": "Valkey normal-key and JSON Datasets, with guarded workflows and compatible project state.",
  "lifecycle": {
    "data_schema_version": 1,
    "data_migrations": []
  },
  "vendor": {
    "name": "Flow Steward"
  },
  "listing": {
    "category": "data",
    "tags": [
      "valkey",
      "toolbox"
    ],
    "summary": "Workflow state, deduplication and bounded queues."
  },
  "features": [
    "tool",
    "action",
    "dataset_connector"
  ],
  "required_scopes": [
    "extension:invoke"
  ],
  "egress": {
    "connection_fields": [
      "valkey_database.host",
      "valkey.host"
    ]
  },
  "account_scope": {
    "scope_type": "project",
    "description": "Explicit project Valkey connections."
  },
  "entrypoint": {
    "mode": "subprocess",
    "command": [
      "python3",
      "main.py"
    ],
    "timeout_seconds": 40
  },
  "health": {
    "command": [
      "python3",
      "health.py"
    ],
    "timeout_seconds": 5
  },
  "ui_manifest": "ui/ui_manifest.yaml",
  "action_manifest": "ui/actions/actions.yaml",
  "python_requirements": [],
  "runtime": {
    "contract_version": "extension_host_v2",
    "compatibility": {
      "platform_min": "1.4.0"
    },
    "extension_contract_v2": {
      "connection_types": "contracts/connection_types.yaml",
      "operation_manifest": "contracts/operation_manifest.yaml",
      "step_ui_manifest": "contracts/step_ui_manifest.yaml",
      "dataset_connectors": [
        {
          "connector_id": "valkey",
          "connector_type_id": "valkey_database",
          "database_kind": "valkey",
          "display_name": "Valkey",
          "description": "Bounded explicit-key string, hash, list and ordinary JSON views. No scans or arbitrary commands.",
          "source_kind": "valkey",
          "source_extension_id": "flowsteward.valkey",
          "source_extension_name": "Valkey",
          "source_provider": "Valkey",
          "query_language": "json",
          "access_mode": "read_only",
          "runtime_kind": "local_extension",
          "runtime_adapter_ref": "main.py",
          "connector_catalog": [
            {
              "source_kind": "valkey",
              "connector_type_id": "valkey_database",
              "display_name": "Valkey",
              "query_language": "json",
              "preset_config": {}
            }
          ],
          "connection_schema": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "host"
            ],
            "properties": {
              "host": {
                "type": "string",
                "title": "Server hostname or IP address",
                "minLength": 1,
                "maxLength": 253
              },
              "port": {
                "type": "integer",
                "title": "Port",
                "minimum": 1,
                "maximum": 65535,
                "default": 6379
              },
              "database": {
                "type": "integer",
                "title": "Database number",
                "minimum": 0,
                "maximum": 15,
                "default": 0
              },
              "tls": {
                "type": "boolean",
                "title": "Use TLS with certificate verification",
                "default": true
              },
              "request_timeout_seconds": {
                "type": "integer",
                "title": "Request timeout seconds",
                "minimum": 1,
                "maximum": 30,
                "default": 15
              },
              "key_prefix": {
                "type": "string",
                "title": "Allowed key prefix (optional)",
                "maxLength": 256,
                "default": ""
              }
            }
          },
          "secret_schema": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "username": {
                "type": "string",
                "title": "ACL username (optional)"
              },
              "password": {
                "type": "string",
                "title": "Password (optional)"
              }
            }
          },
          "capabilities": {
            "read_only": true,
            "test_connection": true,
            "schema_introspection": true,
            "validate_query": true,
            "preview_query": true,
            "execute_template": true,
            "infer_output_schema": true,
            "write_queries": false,
            "row_preview": true
          },
          "safety_profile": {
            "access_mode": "read_only",
            "indexes_rows": false,
            "executes_write_queries": false,
            "requires_saved_template": true
          },
          "preview_support": true,
          "schema_refresh_support": true
        }
      ],
      "resource_query_manifest": [
        {
          "query_id": "runtime_health",
          "cursor_mode": "none",
          "description": "Valkey runtime health.",
          "required_scopes": [
            "extension:invoke"
          ],
          "result_fields": [
            "result.status",
            "result.extension_id"
          ],
          "error_codes": [
            "invalid_payload"
          ]
        },
        {
          "query_id": "supported_connectors",
          "cursor_mode": "none",
          "description": "Valkey supported connectors.",
          "required_scopes": [
            "extension:invoke"
          ],
          "result_fields": [
            "result.connectors"
          ],
          "error_codes": [
            "invalid_payload"
          ]
        }
      ]
    }
  },
  "external_effects": [
    {
      "operation_id": "set",
      "effect_kind": "database_write",
      "channel": "valkey",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "delete",
      "effect_kind": "database_write",
      "channel": "valkey",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "expire",
      "effect_kind": "database_write",
      "channel": "valkey",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "increment",
      "effect_kind": "database_write",
      "channel": "valkey",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "hash_set",
      "effect_kind": "database_write",
      "channel": "valkey",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "hash_delete",
      "effect_kind": "database_write",
      "channel": "valkey",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "list_push",
      "effect_kind": "database_write",
      "channel": "valkey",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "list_pop",
      "effect_kind": "database_write",
      "channel": "valkey",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "json_set",
      "effect_kind": "database_write",
      "channel": "valkey",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    }
  ],
  "machine_auth": {
    "service_account_key": "svc_ext_valkey",
    "required_scopes": [
      "extension:invoke"
    ]
  },
  "query_manifest": "ui/queries/queries.yaml"
}
