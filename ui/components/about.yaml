{
  "component_id": "valkey_about",
  "type": "markdown",
  "title": "Valkey",
  "content": "Read normal database keys and JSON through read-only Datasets. Workflow actions read and write JSON, text, counters, hashes and lists. New database connections use exact keys; legacy project state retains its namespace. TLS verifies certificates. Writes require durable host effect claims and are suppressed in test mode. No database triggers or arbitrary commands. See README.md for bounds and uncertain write handling."
}
