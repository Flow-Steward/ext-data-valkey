{
  "component_id": "valkey_database_connection",
  "type": "connection_form",
  "title": "Valkey database",
  "description": "Use normal database keys for Datasets and workflows. Optional prefix checks the supplied key without renaming it.",
  "data": {
    "connection_kind": "extension",
    "connection_type": "valkey_database",
    "config_fields": [
      "host",
      "port",
      "database",
      "key_prefix",
      "tls",
      "request_timeout_seconds"
    ],
    "secret_fields": [
      "username",
      "password"
    ]
  },
  "defaults": {
    "display_name": "Valkey",
    "port": 6379,
    "database": 0,
    "tls": true,
    "request_timeout_seconds": 15,
    "key_prefix": ""
  },
  "fields": [
    {
      "path": "display_name",
      "label": "Connection name",
      "widget": "text"
    },
    {
      "path": "environment",
      "label": "Environment",
      "widget": "text"
    },
    {
      "path": "host",
      "label": "Server hostname or IP address",
      "widget": "text",
      "required": true,
      "help": "Hostname or IP only; no scheme, URL path, cluster or sentinel endpoint."
    },
    {
      "path": "port",
      "label": "Port",
      "widget": "integer"
    },
    {
      "path": "database",
      "label": "Database number",
      "widget": "integer"
    },
    {
      "path": "key_prefix",
      "label": "Allowed key prefix (optional)",
      "widget": "text",
      "help": "Literal case-sensitive prefix; empty allows all keys authorised by the credentials. Supply the full key."
    },
    {
      "path": "tls",
      "label": "Use TLS with certificate verification",
      "widget": "boolean",
      "help": "Keep enabled for verified TLS. Plaintext requires a private endpoint and host administrator opt-in."
    },
    {
      "path": "request_timeout_seconds",
      "label": "Request timeout seconds",
      "widget": "integer"
    },
    {
      "path": "username",
      "label": "ACL username (optional)",
      "widget": "secret"
    },
    {
      "path": "password",
      "label": "Password (optional)",
      "widget": "secret"
    }
  ]
}
