{
  "schema_version": "extension_descriptor_v1",
  "lifecycle": {
    "data_schema_version": 1,
    "data_migrations": []
  },
  "extension_id": "flowsteward.valkey",
  "release_version": "1.1.8",
  "extension_type": "service_extension",
  "identity": {
    "display_name": "Valkey",
    "description": "Connect Valkey to Flow Steward for small pieces of workflow state, duplicate-event checks and simple list processing. Read or set text and whole JSON values, delete keys, check existence or TTL, apply expiry and increment counters. Hash actions manage fields and values; list actions push or pop items, read a range and return length. Conditional SET supports create-only or update-only changes with optional expiry and reports whether a change applied.\n\nRead-only Dataset views address explicit string, hash, list and JSON keys using saved definitions and typed parameters, with connection testing, validation, previews and schema inference. JSON is stored in normal string keys without a JSON module. Database connections can use existing keys and enforce an allowed key prefix; legacy project-state connections preserve their account/project/connection namespace.\n\nUse create-only SET plus a TTL to claim an incoming event, or push right and pop left for a FIFO list. Choose an expiry appropriate to the duplicate window and check the applied result before continuing. These patterns provide neither exactly-once processing nor acknowledged delivery: list pops remove items immediately. The extension targets a single standalone server and exposes fixed commands rather than cluster discovery, arbitrary scripting or database subscriptions.",
    "tags": [
      "valkey",
      "toolbox"
    ]
  },
  "vendor": {
    "vendor_name": "Flow Steward"
  },
  "listing": {
    "visibility": "public_reference",
    "category": "data"
  },
  "distribution": {
    "channel": "private_byo",
    "execution_modes": [
      "local"
    ],
    "allows_self_hosted": true,
    "requires_connected_control_plane": false,
    "import_sources": [
      "file"
    ]
  },
  "runtime": {
    "contract_version": "extension_host_v2",
    "compatibility": {
      "platform_min": "1.5.0"
    },
    "extension_contract_v2": {
      "connection_types": "contracts/connection_types.yaml",
      "operation_manifest": "contracts/operation_manifest.yaml",
      "step_ui_manifest": "contracts/step_ui_manifest.yaml",
      "dataset_connectors": [
        {
          "connector_id": "valkey",
          "connector_type_id": "valkey_database",
          "database_kind": "valkey",
          "display_name": "Valkey",
          "description": "Bounded explicit-key string, hash, list and ordinary JSON views. No scans or arbitrary commands.",
          "source_kind": "valkey",
          "source_extension_id": "flowsteward.valkey",
          "source_extension_name": "Valkey",
          "source_provider": "Valkey",
          "query_language": "json",
          "access_mode": "read_only",
          "runtime_kind": "local_extension",
          "runtime_adapter_ref": "main.py",
          "connector_catalog": [
            {
              "source_kind": "valkey",
              "connector_type_id": "valkey_database",
              "display_name": "Valkey",
              "query_language": "json",
              "preset_config": {}
            }
          ],
          "connection_schema": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "host"
            ],
            "properties": {
              "host": {
                "type": "string",
                "title": "Server hostname or IP address",
                "minLength": 1,
                "maxLength": 253
              },
              "port": {
                "type": "integer",
                "title": "Port",
                "minimum": 1,
                "maximum": 65535,
                "default": 6379
              },
              "database": {
                "type": "integer",
                "title": "Database number",
                "minimum": 0,
                "maximum": 15,
                "default": 0
              },
              "tls": {
                "type": "boolean",
                "title": "Use TLS with certificate verification",
                "default": true
              },
              "request_timeout_seconds": {
                "type": "integer",
                "title": "Request timeout seconds",
                "minimum": 1,
                "maximum": 30,
                "default": 15
              },
              "key_prefix": {
                "type": "string",
                "title": "Allowed key prefix (optional)",
                "maxLength": 256,
                "default": ""
              }
            }
          },
          "secret_schema": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "username": {
                "type": "string",
                "title": "ACL username (optional)"
              },
              "password": {
                "type": "string",
                "title": "Password (optional)"
              }
            }
          },
          "capabilities": {
            "read_only": true,
            "test_connection": true,
            "schema_introspection": true,
            "validate_query": true,
            "preview_query": true,
            "execute_template": true,
            "infer_output_schema": true,
            "write_queries": false,
            "row_preview": true
          },
          "safety_profile": {
            "access_mode": "read_only",
            "indexes_rows": false,
            "executes_write_queries": false,
            "requires_saved_template": true
          },
          "preview_support": true,
          "schema_refresh_support": true
        }
      ],
      "resource_query_manifest": [
        {
          "query_id": "runtime_health",
          "cursor_mode": "none",
          "description": "Valkey runtime health.",
          "required_scopes": [
            "extension:invoke"
          ],
          "result_fields": [
            "result.status",
            "result.extension_id"
          ],
          "error_codes": [
            "invalid_payload"
          ]
        },
        {
          "query_id": "supported_connectors",
          "cursor_mode": "none",
          "description": "Valkey supported connectors.",
          "required_scopes": [
            "extension:invoke"
          ],
          "result_fields": [
            "result.connectors"
          ],
          "error_codes": [
            "invalid_payload"
          ]
        }
      ]
    }
  }
}
